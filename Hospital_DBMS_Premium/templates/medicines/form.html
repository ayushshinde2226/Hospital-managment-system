{% extends "base.html" %}{% block title %}Add Medicine{% endblock %}
{% block content %}<div class="page-head"><div><span class="eyebrow">PHARMACY</span><h1>Add Medicine</h1></div></div><form method="post" class="panel form-panel"><div class="row g-3">
<div class="col-md-6"><label>Name *</label><input class="form-control" name="name" required></div><div class="col-md-3"><label>Category</label><input class="form-control" name="category"></div><div class="col-md-3"><label>Quantity</label><input class="form-control" type="number" name="quantity" required></div>
<div class="col-md-3"><label>Unit price</label><input class="form-control" type="number" step=".01" name="unit_price" required></div><div class="col-md-3"><label>Manufacturer</label><input class="form-control" name="manufacturer"></div><div class="col-md-3"><label>Batch no.</label><input class="form-control" name="batch_no"></div><div class="col-md-3"><label>Expiry date</label><input class="form-control" type="date" name="expiry_date" required></div><div class="col-md-3"><label>Reorder level</label><input class="form-control" type="number" name="reorder_level" value="10"></div>
</div><button class="btn btn-primary mt-4">Save Medicine</button></form>{% endblock %}
