{% extends "base.html" %}{% block title %}Add Staff{% endblock %}
{% block content %}<div class="page-head"><div><span class="eyebrow">ADMINISTRATION</span><h1>Add Staff</h1></div></div><form method="post" class="panel form-panel"><div class="row g-3"><div class="col-md-6"><label>Name *</label><input class="form-control" name="name" required></div><div class="col-md-6"><label>Designation *</label><input class="form-control" name="designation" required></div><div class="col-md-4"><label>Department</label><input class="form-control" name="department"></div><div class="col-md-4"><label>Phone</label><input class="form-control" name="phone"></div><div class="col-md-4"><label>Email</label><input class="form-control" name="email"></div><div class="col-md-4"><label>Shift</label><select class="form-select" name="shift"><option>Day</option><option>Evening</option><option>Night</option></select></div></div><button class="btn btn-primary mt-4">Save Staff</button></form>{% endblock %}
